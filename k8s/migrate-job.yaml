apiVersion: batch/v1
kind: Job
metadata:
  name: careerscrape-migrate
  namespace: default
spec:
  ttlSecondsAfterFinished: 120
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: joeg69/careerscrape:latest
          command: ["python", "manage.py", "migrate", "--noinput"]
          envFrom:
            - configMapRef:
                name: careerscrape-config
            - secretRef:
                name: careerscrape-secret
