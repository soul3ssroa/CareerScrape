name: Deploy to Kubernetes

on:
  push:
    branches:
      - main

env:
  REGISTRY: docker.io
  IMAGE: joeg69/careerscrape

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG_DATA" > ~/.kube/config

      - name: Update image tag in manifests
        run: |
          sed -i "s|joeg69/careerscrape:latest|${{ env.IMAGE }}:${{ github.sha }}|g" k8s/web-deployment.yaml
          sed -i "s|joeg69/careerscrape:latest|${{ env.IMAGE }}:${{ github.sha }}|g" k8s/worker-deployment.yaml
          sed -i "s|joeg69/careerscrape:latest|${{ env.IMAGE }}:${{ github.sha }}|g" k8s/migrate-job.yaml

      - name: Apply configs and secrets
        run: |
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/secret.yaml

      - name: Apply storage and database
        run: |
          kubectl apply -f k8s/postgres-pvc.yaml
          kubectl apply -f k8s/postgres.yaml

      - name: Wait for Postgres
        run: kubectl rollout status deployment/postgres --timeout=60s

      - name: Run migrations
        run: |
          kubectl delete job careerscrape-migrate --ignore-not-found
          kubectl apply -f k8s/migrate-job.yaml
          kubectl wait --for=condition=complete job/careerscrape-migrate --timeout=120s

      - name: Deploy web and worker
        run: |
          kubectl apply -f k8s/web-deployment.yaml
          kubectl apply -f k8s/worker-deployment.yaml
          kubectl rollout status deployment/careerscrape-web --timeout=120s

      - name: Apply ingress
        run: kubectl apply -f k8s/ingress.yaml
